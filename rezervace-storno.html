<main>
  <div class="content-box">

    <h2>Zrušení rezervace</h2>

    <!-- Uživatel zadá kód, který dostal po rezervaci -->
    <p><strong>Zadejte kód rezervace:</strong> (kód jste dostali při potvrzení rezervace)</p>

    <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
      <input
        type="text"
        id="code"
        placeholder="Např. U7X9VW"
        autocomplete="off"
        autocapitalize="characters"
        inputmode="text"
        style="min-width:200px;"
      >
      <button
        id="btn-cancel"
        type="button"
        style="padding:10px 14px; border-radius:10px; border:0; background:#1e235c; color:#ffd700; font-weight:bold; cursor:pointer;"
      >
        Zrušit rezervaci
      </button>
    </div>

    <!-- Výsledek operace -->
    <div
      id="result-box"
      style="display:none; margin-top:18px; padding:14px; border-radius:12px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.12);"
    >
      <h3 id="result-title" style="margin:0 0 8px 0;"></h3>
      <p id="result-text" style="margin:0;"></p>
    </div>
