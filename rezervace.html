<html lang="cs">

<link rel="stylesheet" href="style.css">

<!-- ✅ FLATPICKR – správná verze -->

<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/cs.js"></script>

<!-- ✅ Globální skript -->
<script src="script.js"></script>
</head

<main class="box">

<h2>Rezervace drah</h2>

<label><strong>Datum:</strong></label>
<input id="datePick" placeholder="Vyberte datum" style="width:100%;padding:10px;">

<div id="slotsArea" style="margin-top:20px; display:none;">
    <h3>Dostupné časy:</h3>
    <div id="slotsOutput"></div>
</div>

<div id="formArea" style="margin-top:20px; display:none;">

    <label>Délka rezervace (hodiny):</label>
    <select id="delka">
        <option value="1">1 hodina</option>
        <option value="2">2 hodiny</option>
        <option value="3">3 hodiny</option>
        <option value="4">4 hodiny</option>
    </select>

    <label>Jméno:</label>
    <input id="jmeno" type="text">

    <label>Email:</label>
    <input id="email" type="email">

    <label>Telefon:</label>
    <input id="tel" type="text">

    <label>Poznámka:</label>
    <textarea id="poznamka"></textarea>

    <button onclick="sendReservation()" class="btn">Odeslat rezervaci</button>
</div>

<div id="result" style="margin-top:20px;"></div>

</main>

<footer>© Kuželky Benešov – 2026</footer>

<script>
/**************************************/
/* ✅ TVOJE FINÁLNÍ EXEC API URL */
/**************************************/
const API_URL = "https://script.google.com/macros/s/AKfycbxz87E8TLbXQ-b8xeBGGrG9DM2BJJ5w33hhMbyuZ8eoe_Lcjas7YFT3ZZjuS3Z8LHYA/exec";

/* Globální stav */
let selectedDate = null;
let selectedTime = null;
let selectedLane = null;

/**************************************/
/* ✅ Inicializace FLATPICKR */
/**************************************/
flatpickr("#datePick", {
    dateFormat: "Y-m-d",
    locale: "cs",
    minDate: "today",
    onChange: function(selectedDates, dateStr) {
        selectedDate = dateStr;
        loadSlots(dateStr);
    }
});

/**************************************/
/* ✅ Načtení slotů */
/**************************************/
async function loadSlots(date){
    if(!date) return;

    const res = await fetch(API_URL + "?action=slots&date=" + date);
    const data = await res.json();

    document.getElementById("slotsArea").style.display = "block";
    const out = document.getElementById("slotsOutput");
    out.innerHTML = "";

    data.forEach(d => {
        out.innerHTML += `<h4>Dráha ${d.draha}</h4>`;

        if(d.casy.length === 0){
            out.innerHTML += `<div style="color:red;">Žádné volné časy</div>`;
            return;
        }

        d.casy.forEach(cas => {
            out.innerHTML += `
                <button onclick="selectSlot(${d.draha}, '${cas}')"
                style="margin:4px; padding:8px 12px;">
                ${cas}
                </button>`;
        });
    });
}

/**************************************/
/* ✅ Výběr slotu */
/**************************************/
function selectSlot(draha, cas){
    selectedLane = draha;
    selectedTime = cas;

    document.getElementById("formArea").style.display = "block";
    document.getElementById("result").innerHTML =
        `Vybráno: dráha <b>${draha}</b>, čas <b>${cas}</b>`;
}

/**************************************/
/* ✅ Odeslání rezervace */
/**************************************/
async function sendReservation(){
    const payload = {
        action:"reserve",
        datum:selectedDate,
        cas:selectedTime,
        draha:selectedLane,
        delka:document.getElementById("delka").value,
        jmeno:document.getElementById("jmeno").value,
        email:document.getElementById("email").value,
        tel:document.getElementById("tel").value,
        poznamka:document.getElementById("poznamka").value
    };

    const res = await fetch(API_URL, {
        method:"POST",
        body:JSON.stringify(payload)
    });

    const txt = await res.text();

    if(txt.includes("OK|")){
        document.getElementById("slotsArea").style.display = "none";
        document.getElementById("formArea").style.display = "none";
        document.getElementById("result").innerHTML =
        `<div style="font-size:26px; color:#00ff00; text-align:center; margin-top:30px;">
            ✅ Rezervace byla úspěšně vytvořena
        </div>`;
    }
    else {
        document.getElementById("result").innerHTML =
        `<span style="color:red;">❌ Chyba: ${txt}</span>`;
    }
}
</script>

</body>
</html>
