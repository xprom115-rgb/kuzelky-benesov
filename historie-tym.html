<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Historie týmu – Kuželky Benešov</title>

  <!-- Hlavní CSS webu -->
  <link rel="stylesheet" href="./style.css?v=13">

  <!-- =========================================================
       Lokální styly jen pro historii týmů
       - zvýraznění Benešova v tabulce
       - zápasy jako tabulka + barvy výsledků
       - dlaždice sezón
       ========================================================= -->
  <style>
    /* Sezónní dlaždice */
    .hist-tile {
      margin-top: 14px;
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .hist-tile h3 { margin: 0; color: #ffd700; }
    .hist-tile .desc { font-size: 13px; opacity: 0.9; margin-top: 6px; }

    /* Zvýraznění Benešova v tabulce */
    .row-benesov {
      background: rgba(255, 215, 0, 0.16) !important;
      outline: 2px solid rgba(255, 215, 0, 0.35);
    }
    .row-benesov td { font-weight: 700; }

    /* Tabulka zápasů */
    .matches-table td, .matches-table th {
      vertical-align: middle;
    }
