<!DOCTYPE html><html lang="cs"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin – Vánoční koulení</title><link rel="stylesheet" href="./style.css?v=13"><style>
.card{background:rgba(20,24,48,.82);border:1px solid rgba(255,215,0,.35);border-radius:14px;padding:16px;margin:14px 0}.toolrow,.reservation-meta{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.toolrow label,.reservation-meta label{display:flex;flex-direction:column;gap:5px}.toolrow input,.toolrow select,.reservation-meta select{padding:9px;border-radius:7px}.events-editor{display:grid;gap:10px}.event-row{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr auto;gap:8px;align-items:end}.event-row input,.event-row select{padding:8px;min-width:0}.admin-reservation-row{display:flex;justify-content:space-between;gap:14px;align-items:center;border-bottom:1px solid rgba(255,255,255,.18);padding:12px 0}.reservation-main{flex:1}.reservation-meta{margin-top:8px}.btn{padding:9px 12px;border:0;border-radius:8px;font-weight:700}.primary{background:#ffd700;color:#18204b}.danger{background:#b52b2b;color:#fff}.small{font-size:13px;opacity:.88}.score-table{width:100%;border-collapse:collapse}.score-table th,.score-table td{padding:7px;border-bottom:1px solid rgba(255,255,255,.2);text-align:right}.score-table th:nth-child(2),.score-table td:nth-child(2){text-align:left}@media(max-width:850px){.event-row{grid-template-columns:1fr 1fr}.admin-reservation-row{align-items:stretch;flex-direction:column}}@media print{@page{size:A4 portrait;margin:12mm}body *{visibility:hidden!important}#score-results-print,#score-results-print *{visibility:visible!important}#score-results-print{position:absolute;left:0;top:0;width:100%;background:#fff!important;color:#000!important}.score-table th,.score-table td{border:1px solid #000!important;color:#000!important;background:#fff!important}.screen-only{display:none!important}}
</style></head><body><header><div class="header-left"><img src="./logo.jpg" class="logo" alt="Logo"></div><div class="header-title">Kuželky Benešov – Admin</div><div class="header-right"></div></header><nav><ul><li><a href="admin.html">Admin</a></li><li><a href="index.html">Domů</a></li></ul></nav><main><div class="content-box"><section id="admin-login" class="card"><h1>Admin – Vánoční koulení</h1><div class="toolrow"><label>E-mail<input id="admin-email" type="email"></label><label>Heslo<input id="admin-pass" type="password"></label><button id="admin-login-btn" class="btn primary" type="button">Přihlásit</button></div><p id="admin-login-msg"></p></section><section id="admin-panel" hidden><div class="card"><div class="toolrow" style="justify-content:space-between"><h1>Vánoční koulení</h1><button id="admin-logout-btn" class="btn" type="button">Odhlásit</button></div><p id="admin-session" class="small"></p><div class="toolrow"><label>Název ročníku<input id="vk-title"></label><label>Cesta k PDF přes FTP<input id="vk-pdf"></label><label><input id="vk-published" type="checkbox"> Zobrazovat pozvánku</label><label><input id="vk-open" type="checkbox"> Povolit registrace</label></div><h2>Termíny</h2><div id="vk-events" class="events-editor"></div><div class="toolrow"><button id="vk-add-pre" class="btn" type="button">Přidat předehrávku</button><button id="vk-save" class="btn primary" type="button">Uložit nastavení</button></div><p id="vk-message"></p></div><div class="card"><h2>Registrace a oprava kategorií</h2><div class="toolrow"><label>Filtr termínu<select id="vk-filter"></select></label><button id="vk-refresh" class="btn" type="button">Obnovit</button></div><div id="vk-list"></div></div><div class="card"><h2>Zadávání výsledků</h2><p class="small">Pořadí: 1. více kuželek, 2. méně nul, 3. více hodovek.</p><div class="toolrow"><label>Typ hráče<select id="score-player-type"><option value="registered">Registrovaní</option><option value="unregistered">Neregistrovaní</option></select></label><label>Kategorie<select id="score-gender"><option value="men">Muži</option><option value="women">Ženy</option></select></label></div><div id="score-pending"></div><div class="toolrow"><label>Hráč<select id="score-player"></select></label><label>Počet kuželek<input id="score-pins" type="number" min="0"></label><label>Počet nul<input id="score-zeros" type="number" min="0"></label><label>Počet hodovek<input id="score-hundreds" type="number" min="0"></label><button id="score-save" class="btn primary" type="button">Uložit výsledek</button></div><p id="score-message"></p><button id="score-print" class="btn" type="button">Tisk výsledkové listiny / PDF</button><div id="score-results-print"></div></div></section></div></main><footer>© Kuželky Benešov – 2026</footer><script type="module" src="./admin-vanocni-kouleni.js?v=6"></script></body></html>
