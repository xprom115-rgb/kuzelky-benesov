<!DOCTYPE html><html lang="cs"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vánoční koulení – registrace</title><link rel="stylesheet" href="./style.css?v=13"><style>
.vk-toolbar,.vk-lane{background:rgba(20,24,48,.78);border:1px solid rgba(255,215,0,.35);border-radius:14px;padding:14px;margin:14px 0}.vk-toolbar select{padding:10px;border-radius:8px}.vk-lane h3{color:#ffd700;margin:0 0 10px}.vk-slots{display:flex;flex-wrap:wrap;gap:7px}.vk-slot{min-width:112px;min-height:46px;border:0;border-radius:9px;padding:7px;font-weight:700}.vk-slot.free{background:#ffd700;color:#17204b;cursor:pointer}.vk-slot.full{background:#8d8d8d;color:#fff}.vk-modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}.vk-modal[hidden]{display:none}.vk-dialog{width:min(440px,100%);background:#20243f;color:#fff;border:1px solid #ffd700;border-radius:16px;padding:20px}.vk-dialog input,.vk-dialog select{width:100%;box-sizing:border-box;padding:11px;border-radius:8px;margin-top:5px}.vk-dialog label{display:block;margin-top:12px}.vk-actions{display:flex;gap:10px;margin-top:14px}.vk-actions button{padding:10px 14px;border:0;border-radius:8px;font-weight:700}.vk-primary{background:#ffd700;color:#17204b}.vk-error{color:#ffb3b3}
</style></head><body><header><div class="header-left"><img src="./logo.jpg" class="logo" alt="Logo"></div><div class="header-title">Vánoční koulení</div><div class="header-right"></div></header><nav><ul><li><a href="index.html">Domů</a></li><li><a href="aktuality.html">Aktuality</a></li><li><a href="rezervace.html">Rezervace</a></li><li><a href="kontakty.html">Kontakty</a></li></ul></nav><main><div class="content-box"><h1>Registrace na Vánoční koulení</h1><div class="vk-toolbar"><label><strong>Vyberte termín:</strong> <select id="vk-event"></select></label></div><div id="vk-status" aria-live="polite"></div><div id="vk-schedule"><em>Načítám…</em></div></div></main><div id="vk-modal" class="vk-modal" hidden><div class="vk-dialog"><h2>Registrace</h2><p id="vk-modal-info"></p><label>Celé jméno<input id="vk-name" maxlength="80" autocomplete="name"></label><label>Kategorie<select id="vk-gender"><option value="men">Muži</option><option value="women">Ženy</option></select></label><label>Typ hráče<select id="vk-player-type"><option value="registered">Registrovaný hráč</option><option value="unregistered">Neregistrovaný hráč</option></select></label><p class="small">Každé jméno může mít pouze jednu rezervaci.</p><div class="vk-actions"><button id="vk-reserve" class="vk-primary" type="button">Zapsat</button><button id="vk-close" type="button">Zrušit</button></div></div></div><footer>© Kuželky Benešov – 2026</footer><script type="module" src="./vanocni-kouleni.js?v=4"></script></body></html>
