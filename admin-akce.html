<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Admin – Zápasy / Turnaje</title>

  <!-- Hlavní styl webu -->
  ./style.css?v=13

  <!-- =========================================================
       Lokální styly administrace akcí

       Tyto styly řeší:
       - řádky formuláře
       - karty
       - výběr dnů v měsíci
       - seznam uložených akcí
       ========================================================= -->
  <style>
    .toolrow {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      margin: 10px 0;
    }

    .toolrow input,
    .toolrow select {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #bbb;
      font-size: 15px;
    }

    .card {
      padding: 14px;
      margin: 12px 0;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.08);
    }

    .small {
      font-size: 13px;
      opacity: 0.85;
    }

    .rowline {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* Samostatný blok pro výběr více dnů */
    .multi-date-panel {
      padding: 14px;
      margin: 12px 0;
      border: 1px solid rgba(255, 215, 0, 0.35);
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.18);
    }

    /* Mřížka se všemi dny vybraného měsíce */
    .month-days-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(74px, 1fr));
      gap: 8px;
      margin-top: 12px;
    }

    /* Tlačítko konkrétního dne */
    .month-day-button {
      min-height: 42px;
      transition:
        background-color 0.15s ease,
        color 0.15s ease,
        border-color 0.15s ease,
        transform 0.15s ease;
    }

    .month-day-button:hover {
      transform: translateY(-1px);
    }

    /* Vybraný den */
    .month-day-button.selected {
      color: #1e235c !important;
      font-weight: 700;
      background: #ffd700 !important;
      border-color: #ffd700 !important;
    }

    /* Tlačítka pro hromadné označení */
    .selection-tools {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 12px;
    }

    /* Zobrazení vybraných datumů */
    .selected-days-info {
      padding: 10px 12px;
      margin-top: 12px;
      border-radius: 10px;
      background: rgba(255, 215, 0, 0.10);
      line-height: 1.5;
    }

    /* Na menších displejích budou vstupy širší */
    @media (max-width: 700px) {
      .toolrow input,
      .toolrow select {
        max-width: 100%;
      }

      #evNote,
      #evTitle {
        width: 100%;
        min-width: 0 !important;
      }

      .month-days-grid {
        grid-template-columns: repeat(3, minmax(70px, 1fr));
      }
    }
  </style>
</head>
