<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Admin – Kuželky Benešov</title>

<!-- ✅ CSS -->
<link rel="stylesheet" href="/kuzelky-benesov/style.css">

<!-- ✅ Globální JS -->
<script src="/kuzelky-benesov/script.js"></script>

<style>
body { font-family: Arial, sans-serif; background:#eee; }
.box {
    max-width: 900px; margin: 30px auto; padding: 25px;
    background: rgba(0,0,0,0.65); color: white; border-radius: 10px;
}
table { width:100%; border-collapse: collapse; background:white; color:black; margin-top:20px; }
th, td { padding:8px; border:1px solid #ccc; }
th { background:#004aad; color:white; }
.btn { padding:6px 12px; border-radius:6px; background:#ffcc00; border:none; cursor:pointer; }
.btn:hover { background:#ffe066; }
</style>

<script>
/* ✅ Sem patří tvoje aktuální EXEC URL */
let API_URL = "https://script.google.com/macros/s/AKfycbxE691-20ZdRVdri6yu-0rfqb9_thmPVef8SkvgTAPMmbhg6GOt0gjzr_8dCv2aIhrn/exec";

let ADMIN_PWD = "xprom115";
let loggedIn = false;

function login(){
    const pwd = document.getElementById("adminPwd").value;

    if (pwd !== ADMIN_PWD){
        document.getElementById("loginError").innerText = "Nesprávné heslo!";
        return;
    }

    loggedIn = true;
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("adminPanel").style.display = "block";

    loadAdminList();
}

async function loadAdminList(){
    if (!loggedIn) return;

    const filter = document.getElementById("filterDate").value;

    const res = await fetch(API_URL + "?action=admin_list&pwd=" + ADMIN_PWD);
    const data = await res.json();

    const tbody = document.querySelector("#rezTable tbody");
    tbody.innerHTML = "";

    data.forEach(item => {

        let d = new Date(item.datum);
        let datum = d.toLocaleDateString("cs-CZ");

        let t = new Date(item.cas);
        let cas = t.toLocaleTimeString("cs-CZ", {hour:"2-digit", minute:"2-digit"});

        if(filter && datum !== new Date(filter).toLocaleDateString("cs-CZ")) return;

        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${datum}</td>
            <td>${cas}</td>
            <td>${item.draha}</td>
            <td>${item.jmeno}</td>
            <td>${item.email}</td>
            <td>${item.tel}</td>
            <td>${item.poznamka}</td>
            <td>${item.stav}</td>
            <td>
                <button class="btn" style="background:#c62828;color:white;" onclick="cancelRez(${item.row})">
                    Zrušit
                </button>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

async function cancelRez(row){
    if(!confirm("Opravdu zrušit rezervaci?")) return;

    const res = await fetch(API_URL + "?action=admin_cancel&pwd=" + ADMIN_PWD + "&row=" + row);
    const txt = await res.text();

    if (txt === "OK"){
        alert("Rezervace zrušena.");
        loadAdminList();
    } else {
        alert("Chyba: " + txt);
    }
}
</script>

</head>

<body>

<header>
    <img src="/kuzelky-benesov/img/benesov.jpg" alt="">
    <h1>Kuželky Benešov – Admin</h1>
    <img src="/kuzelky-benesov/img/logo.jpg" alt="">
</header>

<nav>
    <a href="/kuzelky-benesov/index.html">Domů</a>
    <a href="/kuzelky-benesov/aktuality.html">Aktuality</a>
    <a href="/kuzelky-benesov/historie.html">Historie</a>
    <a href="/kuzelky-benesov/druzstva.html">Družstva</a>
    <a href="/kuzelky-benesov/rezervace.html">Rezervace</a>
    <a href="/kuzelky-benesov/habadura.html">Habaďura</a>
    <a href="/kuzelky-benesov/kontakty.html">Kontakty</a>
    <a href="/kuzelky-benesov/admin.html">Admin</a>
</nav>

<main class="box">

<div id="loginBox">
    <h2>Přihlášení do administrace</h2>

    <label>Heslo:</label>
    <input type="password" id="adminPwd">

    <button class="btn" onclick="login()">Přihlásit</button>

    <div id="loginError" style="color:red;margin-top:10px;"></div>
</div>

<div id="adminPanel" style="display:none;">
    <h2>Administrace rezervací</h2>

    <label>Filtrovat datum:</label>
    <input type="date" id="filterDate" onchange="loadAdminList()">

    <table id="rezTable">
        <thead>
            <tr>
                <th>Datum</th>
                <th>Čas</th>
                <th>Dráha</th>
                <th>Jméno</th>
                <th>Email</th>
                <th>Tel</th>
                <th>Poznámka</th>
                <th>Stav</th>
                <th>Zrušit</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

</main>

<footer>© Kuželky Benešov – 2026</footer>

</body>
</html>
``
