  <style>
    .season-grid{
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap:14px;
      margin-top:14px;
    }
    .season-card{
      padding:16px;
      border-radius:14px;
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.12);
    }
    .season-card h3{ margin:0; color:#ffd700; }
    .season-card .meta{ margin-top:6px; opacity:0.85; font-size:13px; }
    .actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:12px;
    }
    .btn-link{
      padding:10px 14px;
      border-radius:10px;
      background:#1e235c;
      color:#ffd700;
      font-weight:bold;
      display:inline-block;
    }
    .btn-link.disabled{
      opacity:0.35;
      pointer-events:none;
      cursor:not-allowed;
    }
  </style>
</head>
