<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <title>Admin – Habaďůra</title>
  <link rel="stylesheet" href="./style.css?v=1">
  <style>
    .toolrow{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:10px 0;}
    .toolrow input,.toolrow select{padding:10px 12px;border-radius:10px;border:1px solid #bbb;font-size:15px;}
    .btn-primary{padding:10px 14px;border-radius:10px;border:0;background:#1e235c;color:#ffd700;font-weight:bold;cursor:pointer;}
    .btn-soft{padding:10px 14px;border-radius:10px;border:0;background:#ececec;font-weight:bold;cursor:pointer;}
    .btn-danger{padding:8px 12px;border-radius:10px;border:0;background:#ffdddd;font-weight:bold;cursor:pointer;}
    .card{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);border-radius:14px;padding:14px;margin:12px 0;}
    .listrow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.15);}
    .listrow:last-child{border-bottom:none;}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
    @media (max-width:820px){.grid2{grid-template-columns:1fr;}}
    .small{font-size:13px;opacity:0.85;}
    .mono{font-family:ui-monospace,Menlo,Consolas,monospace;}
    .panel{display:none;}
    .panel.active{display:block;}
  </style>
</head>

<body>
<header>
  <div class="header-left"><img src="logo.jpg" class="logo" alt="Logo"></div>
  <div class="header-title">Admin – Habaďůra</div>
  <div class="header-right"></div>
</header>

<nav>
  <ul>
    <li><a href="index.html">Domů</a></li>
    <li><a href="habadura.html">Habaďůra</a></li>
    <li><a href="admin.html">Admin</a></li>
  </ul>
</nav>

<main>
  <div class="content-box">

    <div id="loginBox" class="card">
      <h2>Přihlášení admina</h2>
      <p class="small">Přihlášení probíhá přes Firebase Authentication (Email/Password).</p>
      <div class="toolrow">
        <input id="email" type="email" placeholder="Email admina">
        <input id="pass" type="password" placeholder="Heslo">
        <button id="btnLogin" class="btn-primary">Přihlásit</button>
      </div>
      <div id="loginMsg" class="small"></div>
    </div>

    <div id="appBox" class="card" style="display:none;">
      <div class="toolrow" style="justify-content:space-between;">
        <div>
          <h2 style="margin:0;">Správa zápasů</h2>
          <div class="small">Editace/smazání zápasů (jen admin).</div>
        </div>
        <button id="btnLogout" class="btn-soft">Odhlásit</button>
      </div>

      <hr style="margin:14px 0;">

      <div class="toolrow">
        <label><strong>Liga:</strong></label>
        <select id="liga">
          <option value="1">1. liga</option>
          <option value="2">2. liga</option>
        </select>

        <label><strong>Datum:</strong></label>
        <input id="filterDate" type="date">
        <button id="clearFilter" class="btn-soft">Zrušit filtr</button>
      </div>

      <div id="matchesList"></div>
    </div>

    <!-- Editor -->
    <div id="editBox" class="card" style="display:none;">
      <h3>Upravit zápas</h3>
      <div class="toolrow">
        <label><strong>Datum:</strong></label>
        <input id="editDate" type="date">
      </div>

      <div class="grid2">
        <div>
          <h4 style="color:#ffd700;margin:6px 0;">Domácí</h4>
          <select id="editHomeTeam"></select>
          <div id="editHomePlayers"></div>
          <div class="small">Součet: <span id="sumHome" class="mono">0</span> | Body: <span id="bodyHome" class="mono">0</span></div>
        </div>

        <div>
          <h4 style="color:#ffd700;margin:6px 0;">Hosté</h4>
          <select id="editAwayTeam"></select>
          <div id="editAwayPlayers"></div>
          <div class="small">Součet: <span id="sumAway" class="mono">0</span> | Body: <span id="bodyAway" class="mono">0</span></div>
        </div>
      </div>

      <div class="toolrow" style="margin-top:12px;">
        <button id="btnCloseEdit" class="btn-soft">Zavřít</button>
        <button id="btnSaveEdit" class="btn-primary">Uložit změny</button>
        <button id="btnDeleteMatch" class="btn-danger">Smazat zápas</button>
        <span id="editMsg" class="small"></span>
      </div>
    </div>

  </div>
</main>

<footer>© Kuželky Benešov – 2026</footer>

<script type="module" src="./admin-habadura.js?v=1"></script>
</body>
</html>
