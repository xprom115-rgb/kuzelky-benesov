<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Memoriál Vavříka a Košaře – Habaďůra</title>

  <!-- CSS -->
  <link rel="stylesheet" href="./style.css?v=999y (jen tady, bezpečně v <style>) -->
  <style>
    .liga-switch { display:flex; gap:10px; margin:18px 0; flex-wrap:wrap; }
    .liga-btn{
      padding:10px 16px; border-radius:10px;
      border:1px solid #ffd700; background:#1e235c; color:#ffd700;
      cursor:pointer; font-weight:bold;
    }
    .liga-btn.active{ background:#ffd700; color:#1e235c; }
  </style>
</head>

<body>

<header>
  <div class="header-left">
    <img src="logo.jpg" class="logo" alt="Logole">Memoriál Vavříka a Košaře – Habaďůra</div>
  <div class="header-right"></div>
</header>

<nav>
  <ul>
    <li><a href="index.html/li>
    <li><a href="aktuality.html</a></li>
    <li><a href="historie.html/a></li>
    <li><a href="druzstva.html/a></li>
    <li><a href="rezervace.html</a></li>
    <li><a href="habadura.html/a></li>
    <li><a href="kontakty.html/a></li>
    <li><a href="admin.html</li>
  </ul>
</nav>

<main>
  <div class="content-box">
    <h2>Memoriál Vavříka a Košaře – výsledky</h2>

    <div class="liga-switch">
      <button type="button" id="btn-liga1" class="liga-btn active">1. liga</button>
      <button type="button" id="btn-liga2" class="liga-btn">2. liga</button>
    </div>

    <h3 style="color:#ffd700;">Zadání výsledku zápasu</h3>

    <div class="form-block">
      <div class="toolrow">
        <label><strong>Liga:</strong></label>
        <select id="liga-select">
          <option value="1">1. liga</option>
          <option value="2">2. liga</option>
        </select>
      </div>

      <div class="toolrow">
        <label><strong>Domácí:</strong></label>
        <select id="team-home"></select>

        <label><strong>Hosté:</strong></label>
        <select id="team-away"></select>
      </div>

      <h4 style="color:#ffd700; margin-top:16px;">Domácí hráči</h4>
      <div id="home-players">
        <div class="player-row">
          <select class="home-player"></select>
          <input type="number" min="0" placeholder="Kuželky" class="home-kuz">
          <input type="number" min="0" max="2" placeholder="Body" class="home-body">
        </div>
        <div class="player-row">
          <select class="home-player"></select>
          <input type="number" min="0" placeholder="Kuželky" class="home-kuz">
          <input type="number" min="0" max="2" placeholder="Body" class="home-body">
        </div>
        <div class="player-row">
          <select class="home-player"></select>
          <input type="number" min="0" placeholder="Kuželky" class="home-kuz">
          <input type="number" min="0" max="2" placeholder="Body" class="home-body">
        </div>
      </div>

      <h4 style="color:#ffd700; margin-top:16px;">Hosté hráči</h4>
      <div id="away-players">
        <div class="player-row">
          <select class="away-player"></select>
          <input type="number" min="0" placeholder="Kuželky" class="away-kuz">
          <input type="number" min="0" max="2" placeholder="Body" class="away-body">
        </div>
        <div class="player-row">
          <select class="away-player"></select>
          <input type="number" min="0" placeholder="Kuželky" class="away-kuz">
          <input type="number" min="0" max="2" placeholder="Body" class="away-body">
        </div>
        <div class="player-row">
          <select class="away-player"></select>
          <input type="number" min="0" placeholder="Kuželky" class="away-kuz">
          <input type="number" min="0" max="2" placeholder="Body" class="away-body">
        </div>
      </div>

      <div class="toolrow" style="margin-top:14px;">
        <label><strong>Datum zápasu:</strong></label>
        <input type="date" id="match-date">
      </div>

      <div class="summary">
        <strong>Souhrn:</strong><br>
        Body: <span id="sum-body" class="mono">0 : 0</span><br>
        Kuželky: <span id="sum-kuz" class="mono">0 : 0</span>
      </div>

      <button type="button" id="submit-match" class="save-btn">Uložit zápas</button>
    </div>

    <h3 style="color:#ffd700;">Tabulka družstev</h3>
    <div id="tab-druzstva"></div>

    <h3 style="color:#ffd700;">Tabulka hráčů</h3>
    <div id="tab-hracu"></div>

    <h3 style="color:#ffd700;">Tabulka zápasů (matice)</h3>
    <div id="tab-matice"></div>

  </div>
</main>

<footer>© Kuželky Benešov – 2026</footer>

<!-- ✅ Načítáme jen jeden modul, který si importuje db -->

<script type="module" src="./habadura.js?v=999"></script>
</body>
</html>
