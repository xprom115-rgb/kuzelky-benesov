  <style>
    .liga-switch { display:flex; gap:10px; margin:14px 0 10px 0; flex-wrap:wrap; }
    .liga-btn{

    .liga-btn.active{ background:#ffd700; color:#1e235c; }

    .badge{

      background: rgba(255, 215, 0, 0.15);
      border: 1px solid rgba(255, 215, 0, 0.6);
      color: #ffd700;
      margin-left:10px;
      white-space: nowrap;
      vertical-align: middle;
    }
.back-btn{
  padding:10px 16px;
  border-radius:10px;
  border:1px solid #ffd700;
  background:#1e235c;
  color:#ffd700;
  cursor:pointer;
  font-weight:bold;
}
.back-btn:hover{
  background:#ffd700;
  color:#1e235c;
}

  </style>
