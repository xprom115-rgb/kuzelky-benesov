<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Habaďůra – výsledky (sezóna)</title>

  <!-- Globální CSS -->
  <link rel="stylesheet" href="./style.css?v=1">

  <!-- Lokální drobné styly (jen pro přepínač lig a badge) -->
  <style>
    .liga-switch { display:flex; gap:10px; margin:14px 0 10px 0; flex-wrap:wrap; }
    .liga-btn{
      padding:10px 16px; border-radius:10px;
      border:1px solid #ffd700; background:#1e235c; color:#ffd700;
      cursor:pointer; font-weight:bold;
    }
    .liga-btn.active{ background:#ffd700; color:#1e235c; }

    .badge{
      display:inline-block;
      font-size:13px; font-weight:bold;
      padding:4px 10px; border-radius:999px;
      background: rgba(255, 215, 0, 0.15);
      border: 1px solid rgba(255, 215, 0, 0.6);
      color: #ffd700;
      margin-left:10px;
      white-space: nowrap;
      vertical-align: middle;
    }
.back-btn{
  padding:10px 16px;
  border-radius:10px;
  border:1px solid #ffd700;
  background:#1e235c;
  color:#ffd700;
  cursor:pointer;
  font-weight:bold;
}
.back-btn:hover{
  background:#ffd700;
  color:#1e235c;
}
@media print {
  /* schovat navigaci a ovládací prvky */
  header, nav, footer,
  .liga-switch,
  .back-btn {
    display: none !important;
  }

 @media print {
  /* 1) schovat navigaci a ovládání */
  header, nav, footer, .liga-switch, .back-btn { display: none !important; }

  /* 2) čistý tisk bez pozadí */
  body { background: #fff !important; }
  .content-box { background: #fff !important; box-shadow: none !important; }

  /* 3) černý text kvůli čitelnosti */
  h2, h3, p, th, td { color: #000 !important; }

  /* 4) pevné stránkování: každá sekce na vlastní stránku */
  #teamsSection { break-after: page; page-break-after: always; }
  #playersSection { break-after: page; page-break-after: always; }
  #maticeSection { break-before: page; page-break-before: always; }

  /* 5) tabulky se nelámou uprostřed, pokud to jde */
  table { break-inside: avoid; page-break-inside: avoid; }

  /* 6) matice bývá široká – zmenšíme písmo */
  #maticeSection table { font-size: 11px; }
}
  
/* Skrytí jen na obrazovce (ne při tisku) */
.hide-on-screen { display: none; }
@media print { .hide-on-screen { display: block !important; } }

  </style>
</head>

<body>

<header>

  </div>
  <div class="header-title">Kuželky Benešov</div>
  <div class="header-right"></div>
</header>

<nav>

    <li><a href="kontakty.html">Kontakty</a></li>
    <li><a href="admin.html">Admin</a></li>
  </ul>
</nav>
<main>
  <div class="content-box">

    <h2 style="margin-bottom:6px;">
      Habaďůra – výsledky
      <span id="histBadge" class="badge"></span>
    </h2>

    <!-- Zpět na sezóny -->
<a href="habadura-sezony.html" class="back-btn">← Zpět na sezóny</a>
<!-- Tisk -->
    <button type="button" class="back-btn" onclick="window.print()">🖨️ Tisk / PDF</button>
    <!-- Přepínač lig -->
    <div class="liga-switch">
      <button type="button" id="btn-liga1" class="liga-btn active">1. liga</button>
      <button type="button" id="btn-liga2" class="liga-btn">2. liga</button>

<div id="teamsSection">

</div>


   
<div id="playersSection">

    <!-- Matice (lze ve finále skrýt pomocí JS) -->
