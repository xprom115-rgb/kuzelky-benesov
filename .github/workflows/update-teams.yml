name: Weekly Update (teams JSON)

on:
  schedule:
    # Každou neděli 03:00 UTC (můžeš změnit)
    - cron: "0 3 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run updater (test)
        run: |
          python scripts/update_teams.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/teams/*.json
          git diff --cached --quiet || git commit -m "Auto update teams JSON"
          git push
