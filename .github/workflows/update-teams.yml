name: Weekly Update (teams JSON)

on:
  schedule:
    # Každou neděli 03:00 UTC
    - cron: "0 3 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 lxml

      - name: Verify deps
        run: |
          python -c "import requests; import bs4; import lxml; print('deps OK')"

      - name: Run updater
        run: |
          python scripts/update_teams.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/teams/*.json
          git diff --cached --quiet || git commit -m "Auto update teams JSON"
          git push
