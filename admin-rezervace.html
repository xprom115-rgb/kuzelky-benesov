<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin – Rezervace</title>

  <link rel="stylesheet" href="./style.css?v=1">

  <style>
    /* drobné lokální styly – zbytek bere z style.css */
    .toolrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
    .card{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);border-radius:14px;padding:14px;margin:12px 0;}
    .small{font-size:13px;opacity:0.85;}
  </style>
</head>

<body>

<header>
  <div class="header-left">
    <img src="./logo.jpg" class="logo" alt="Logo">
  </div>
  <div class="header-title">Kuželky Benešov – Admin</div>
  <div class="header-right"></div>
</header>

<nav>
  <ul>
    <li><a href="index.html">Domů</a></li>
    <li><a href="aktuality.html">Aktuality</a></li>
    <li><a href="rezervace.html">Rezervace</a></li>
    <li><a href="kontakty.html">Kontakty</a></li>
    <li><a href="admin.html">Admin</a></li>
  </ul>
</nav>

<main>
  <div class="content-box">

    <!-- =========================================================
         LOGIN (nově Firebase Auth: Email/Password)
         - po přihlášení se schová a zobrazí se #admin-panel
         ========================================================= -->
    <div id="admin-login" class="card">
      <h2>Admin – přihlášení</h2>
      <p class="small">Přihlášení probíhá přes Firebase Authentication (Email/Password).</p>

      <div class="toolrow">
        <input id="admin-email" type="email" placeholder="Email admina"
               style="padding:10px 12px; border-radius:10px; border:1px solid #bbb; min-width:240px;">
        <input id="admin-pass" type="password" placeholder="Heslo"
               style="padding:10px 12px; border-radius:10px; border:1px solid #bbb; min-width:220px;">

        <button id="admin-login-btn" class="btn-primary" type="button">Přihlásit</button>
      </div>

      <p id="admin-login-msg" class="small" style="margin-top:10px;"></p>
    </div>

    <!-- =========================================================
         PANEL 
         ========================================================= -->
    <div id="admin-panel" class="card" style="display:none;">

      <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;">
        <h2 style="margin:0;">Admin – Rezervace</h2>

        <!-- Odhlášení – ponechávám tvé ID, aby šlo snadno napojit -->
        <button id="admin-logout-btn" class="btn-soft" type="button">Odhlásit</button>
      </div>

      <hr style="margin:14px 0;">

      <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
        <label for="filter-date"><strong>Filtr data:</strong></label>
        <input id="filter-date" type="date"
               style="padding:8px 10px; border-radius:10px; border:1px solid #bbb;">

        <button id="filter-clear" class="btn-soft" type="button">Zrušit filtr</button>
      </div>

      <!-- ✅ ÚKLID DO VČEREJŠKA -->
      <div style="margin-top:12px; display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
        <button id="cleanup-old" class="btn-danger" type="button" style="font-weight:700;">
          Smazat rezervace do včerejška
        </button>

        <span class="small">
          (smaže všechny rezervace se dnem menším než dnešní datum)
        </span>
      </div>

      <div id="admin-list" style="margin-top:16px;"></div>
    </div>

  </div>
</main>

<footer>© Kuželky Benešov – 2026</footer>

<!-- =========================================================
     Nový login skript (Firebase email/password)
     ========================================================= -->
<script type="module" src="./admin-rezervace.js?v=2"></script>
<script type="module" src="./admin.js?v=1"></script>

</body>
</html>
